services:
  # 1. Unified Web Service (FastAPI + HTML Frontend + TrOCR Model)
  - type: web
    name: arog-app
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

# 2. Managed PostgreSQL Database
databases:
  - name: arog-db
    databaseName: arog_db
    user: arog_user
    plan: free
